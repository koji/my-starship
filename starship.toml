# ---------------------------------------------------
# トップレベルの設定
# ---------------------------------------------------
add_newline = true
command_timeout = 3000 #ms

# 全体のレイアウトを明示的に定義
format = """
$sudo$username$directory$git_branch$git_commit$git_status$rust$python$nodejs$bun$docker_context$cmd_duration
$character"""

# 時間を右プロンプトに配置して入力スペースを確保
right_format = """$time"""

# ---------------------------------------------------
# プロンプトの基本設定
# ---------------------------------------------------
[character]
format = "❯❯ "
success_symbol = "❯❯(bold green) "
error_symbol = "❯❯(bold red) "

[username]
style_root = "green bold"
format = "😈 [$user]($style) "
disabled = false
show_always = true

[sudo]
disabled = false
symbol = "🧙 "
format = "[$symbol]($style)"
style = "bold red"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"

[time]
disabled = false
time_format = "%Y-%m-%d %H:%M"
utc_time_offset = "local"

[cmd_duration]
min_time = 2_000 # 2秒以上かかったコマンドの実行時間を表示
format = "took [$duration]($style) "
style = "yellow bold"

# ---------------------------------------------------
# Git 関連
# ---------------------------------------------------
[git_branch]
symbol = '🌱 '
truncation_length = 30 # 長すぎるブランチ名で圧迫されないように調整
truncation_symbol = "…"
style="bold purple"

[git_commit]
commit_hash_length = 6
style = "bold blue"
tag_symbol = '🔖 '
format = '[\($hash$tag\)]($style) '

[git_status]
conflicted = "💥"
ahead = "🏎💨"
behind = "😰"
diverged = "😵"
untracked = "🌚‍"
stashed = "📦"
modified = "📝"
staged = '🔦'
renamed = "🏷"
deleted = "🗑"

# ---------------------------------------------------
# 言語・ツール 関連
# ---------------------------------------------------
[rust]
format = "via [🦀 $version](red bold) "

[python]
pyenv_version_name = true
format = "via [🐍 $version](bold yellow) " # 他の言語とデザインを統一

[nodejs]
format = "via [🤖 $version](bold green) "

[bun]
format = "via [🥟 $version](bold light_yellow) "

[docker_context]
symbol = "🐳 "
format = "via [$symbol$context]($style) "
style = "blue bold"
only_with_files = true # Dockerfileやdocker-compose.ymlがある時のみ表示

# ---------------------------------------------------
# 無効化するモジュール
# ---------------------------------------------------
[aws]
disabled = true

[hostname]
disabled = true

[package]
disabled = true
